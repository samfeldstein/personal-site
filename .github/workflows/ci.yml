name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "43 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: node scripts/sync.mjs --check
      - run: node scripts/check.mjs
      - run: node --test test/*.test.mjs

  deployed:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deployed
      cancel-in-progress: true
    steps:
      - name: Wait for this commit to go live
        run: |
          for i in $(seq 1 30); do
            live=$(curl -s "https://samfeldstein.xyz/version.txt?t=$(date +%s)" | tr -d '[:space:]')
            if [ "$live" = "$GITHUB_SHA" ]; then echo "Live: $live"; exit 0; fi
            sleep 30
          done
          echo "After 15 minutes the site still serves ${live:-nothing}, not $GITHUB_SHA."
          echo "The Cloudflare build or deploy probably failed; see Workers Builds in the dashboard."
          exit 1

  live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check the live pages
        run: |
          fail=0
          for path in / /code/ /photos/ /published-writing/; do
            status=$(curl -s -o /dev/null -w '%{http_code}' --retry 2 "https://samfeldstein.xyz$path")
            echo "$status $path"
            [ "$status" = "200" ] || fail=1
          done
          exit $fail
